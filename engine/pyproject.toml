[project]
name = "copilot"
version = "0.1.0"
description = "Copilot engine: system-audio loopback, local transcription, Claude agents"
readme = "README.md"
authors = [
    { name = "Hunter Baldwin", email = "huntercbaldwin98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.183",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.5",
    "pyaudiowpatch>=0.2.12.9",
    "sherpa-onnx>=2.0.1",
    "soxr>=1.1.0",
    "websockets>=17.4",
]

[project.scripts]
copilot = "copilot:main"

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.2.1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
